<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;600;700;800&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; font-family: 'Inter', system-ui, sans-serif; color: #111111; }
.hand { font-family: 'Caveat', cursive; }
.pink { color: #ff2d78; }
.pink-bg { background: #ff2d78; color: #fff; }
.paper {
  position: relative;
  background: #fafaf8;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
}
.paper-torn {
  clip-path: polygon(
    0% 2%, 3% 0%, 8% 1%, 14% 0%, 22% 2%, 30% 0%, 38% 1%, 46% 0%, 54% 2%, 62% 0%, 70% 1%, 78% 0%, 86% 2%, 94% 0%, 100% 1%,
    100% 98%, 97% 100%, 90% 99%, 82% 100%, 74% 98%, 66% 100%, 58% 99%, 50% 100%, 42% 98%, 34% 100%, 26% 99%, 18% 100%, 10% 98%, 2% 100%, 0% 99%
  );
}
.tape {
  position: absolute;
  width: 72px; height: 28px;
  background: linear-gradient(135deg, rgba(30,30,30,.92), rgba(10,10,10,.88));
  opacity: .85;
  transform: rotate(-35deg);
  border-radius: 2px;
}
.tape-tr { top: -6px; right: 48px; transform: rotate(25deg); }
.tape-tl { top: -4px; left: 40px; }
.tape-br { bottom: 12px; right: 24px; transform: rotate(-15deg); width: 64px; }
.tape-bl { bottom: 8px; left: 20px; transform: rotate(12deg); width: 58px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid #e5e7eb; background: #fff;
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip svg { width: 14px; height: 14px; flex-shrink: 0; }
.sticky {
  position: absolute;
  padding: 14px 16px;
  box-shadow: 2px 4px 12px rgba(0,0,0,.2);
  font-size: 22px; line-height: 1.15;
  transform: rotate(4deg);
  max-width: 200px;
}
.sticky-tape {
  position: absolute; top: -10px; left: 50%; margin-left: -28px;
  width: 56px; height: 18px;
  background: rgba(245,230,200,.75);
  transform: rotate(-2deg);
}
.torn-chip {
  display: inline-block;
  padding: 6px 14px;
  font-size: 12px; font-weight: 700;
  transform: rotate(-3deg);
  clip-path: polygon(2% 15%, 0% 45%, 3% 85%, 8% 100%, 92% 98%, 100% 70%, 97% 25%, 90% 0%, 12% 2%);
}
.torn-chip.black { background: #111; color: #fff; }
.torn-chip.white { background: #fff; color: #111; border: 1px solid #ddd; }
.torn-chip.pink { background: #ff2d78; color: #fff; }
.conclusion-wrap { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.conclusion-label {
  font-family: 'Caveat', cursive;
  font-size: 26px; padding: 4px 10px;
  background: #fff;
  clip-path: polygon(0 20%, 5% 0, 95% 5%, 100% 30%, 98% 100%, 10% 95%, 0 70%);
}
.conclusion-arrow {
  width: 48px; height: 24px;
  border: none; background: transparent;
}
.conclusion-box {
  border: 3px solid #111;
  padding: 10px 18px;
  font-weight: 800;
  font-size: 22px;
  line-height: 1.1;
  background: #fff;
}
.marker-under {
  background: linear-gradient(transparent 60%, rgba(239,68,68,.45) 60%);
}
.brand {
  position: absolute; bottom: 10px; left: 16px;
  font-size: 10px; letter-spacing: .12em; color: #94a3b8; font-weight: 600;
}

html, body { margin:0; width:860px; height:400px; overflow:hidden; }
.stage { width:860px; height:400px; background:#0b1020; position:relative; }
.sheet {
  width:860px; height:400px; position:relative; box-sizing:border-box;
  background: transparent;
}
.board-safe {
  position:absolute;
  left:246px; top:16px;
  width:368px; height:368px;
  box-sizing:border-box;
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:10px 8px;
  padding:4px 6px;
}
.col-headline {
  grid-column:1; grid-row:1 / span 2;
  display:flex; align-items:center; justify-content:center;
  text-align:center; position:relative; min-width:0;
}
.col-deco {
  grid-column:2; grid-row:1 / span 2;
  position:relative; min-height:0; min-width:0;
}
.hl {
  font-size:36px; font-weight:800; line-height:1.06; letter-spacing:-0.03em;
  max-width:100%; overflow:hidden;
}
.hl-accent { color:#ff1f6b; }
.hl-line { margin-bottom:0.06em; word-break:break-word; hyphens:auto; }
.cover-sticky {
  position:absolute; top:52px; right:0; width:154px; height:95px;
  padding:8px 10px; box-sizing:border-box; font-size:22px; line-height:1.1;
  transform:rotate(4deg); z-index:4; box-shadow:2px 6px 14px rgba(0,0,0,.18);
  display:flex; align-items:center; justify-content:center; text-align:center;
}
.cover-sticky .sticky-text {
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.sticky-ul { background:linear-gradient(transparent 58%, rgba(239,68,68,.55) 58%); }
.sticky-tape-beige {
  position:absolute; top:-10px; left:50%; margin-left:-34px; width:68px; height:18px;
  background:rgba(235,220,185,.88); transform:rotate(-2deg);
}
.slot-badge {
  position:absolute; top:0; right:0; border:3px solid #111; padding:6px 12px;
  font-weight:800; font-size:18px; white-space:nowrap; z-index:6; background:#fff;
}
.slot-chips {
  position:absolute; top:108px; right:0; width:100%;
  display:flex; flex-direction:column; align-items:flex-end; gap:5px; z-index:6;
  pointer-events:none; max-height:88px; overflow:hidden;
}
.chip-tilt { font-size:18px; padding:5px 10px; transform:rotate(var(--rot)); max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.slot-ui {
  position:absolute; bottom:0; right:0; left:0; z-index:5;
  max-height:148px;
  background:#fff; border-radius:10px; padding:8px 10px 8px;
  box-shadow:0 8px 22px rgba(0,0,0,.14); border:1px solid #e5e7eb;
  font-size:17px;
}
.slot-ui h4 { font-size:17px; margin:0 0 6px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ui-row { display:flex; justify-content:space-between; align-items:center; margin:4px 0; gap:6px; }
.ui-row span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
.toggle { width:32px; height:18px; border-radius:999px; background:#e5e7eb; position:relative; flex-shrink:0; }
.toggle.on { background:#ff2d78; }
.toggle.on::after {
  content:''; position:absolute; right:3px; top:3px; width:12px; height:12px; background:#fff; border-radius:50%;
}
.ui-foot { margin-top:6px; display:flex; gap:8px; justify-content:flex-end; font-size:11px; align-items:center; }
.muted { color:#64748b; }
.apply { background:#ff2d78; color:#fff; padding:3px 10px; border-radius:6px; font-weight:600; }
.paper-torn {
  clip-path: polygon(
    0% 2%, 3% 0%, 8% 1%, 14% 0%, 22% 2%, 30% 0%, 38% 1%, 46% 0%, 54% 2%, 62% 0%, 70% 1%, 78% 0%, 86% 2%, 94% 0%, 100% 1%,
    100% 98%, 97% 100%, 90% 99%, 82% 100%, 74% 98%, 66% 100%, 58% 99%, 50% 100%, 42% 98%, 34% 100%, 26% 99%, 18% 100%, 10% 98%, 2% 100%, 0% 99%
  );
}
.tape-corner {
  position:absolute; width:42px; height:14px;
  background:linear-gradient(135deg,rgba(22,22,22,.88),rgba(8,8,8,.92));
  opacity:.75; z-index:10;
}
.tape-tl { top:6px; left:22px; transform:rotate(-30deg); }
.tape-tr { top:8px; right:26px; transform:rotate(26deg); }
.brand-mark {
  position:absolute; bottom:6px; right:10px; font-size:11px; font-weight:700;
  letter-spacing:0.14em; color:#64748b; z-index:6;
}
</style></head><body>
<div class="stage">
  <div class="paper paper-torn sheet" data-layout-paper="1">
    <div class="tape-corner tape-tl"></div><div class="tape-corner tape-tr"></div>
    <div class="board-safe" id="composition" data-thumbnail-safe="1">
      <div class="col-headline">
        <div class="hl" data-layout-slot="slot-headline"><div class="hl-line">ОТВЕТ ЭКСПЕРТИЗЕ</div>
<div class="hl-line">БЕЗ ПРОПУСКА <span class="hl-accent">СРОКА</span></div></div>
      </div>
      <div class="col-deco">
        <div class="slot-badge" data-layout-slot="slot-badge">ТЗ</div>
        <div class="cover-sticky hand" data-layout-slot="slot-sticky" style="background:#f7e58c"><div class="sticky-tape-beige"></div><div class="sticky-text">чужой знак — <span class="sticky-ul">отказ</span></div></div>
        <div class="slot-chips" data-layout-slot="slot-chips"><div class="torn-chip black chip-tilt" style="--rot:-6deg">относительные о…</div><div class="torn-chip white chip-tilt" style="--rot:4deg">относительные о…</div><div class="torn-chip pink chip-tilt" style="--rot:-5deg">куда направлять…</div></div>
        <div class="slot-ui" data-layout-slot="slot-ui-card">
          <h4>Проверка обозначения</h4><div class="ui-row"><span>Реестр ФИПС</span><span class="toggle on"></span></div><div class="ui-row"><span>Классы МКТУ</span><span class="toggle on"></span></div><div class="ui-row"><span>Оценка риска</span><span class="toggle "></span></div>
          <div class="ui-foot"><span class="muted">Сохранить</span><span class="apply">Применить</span></div>
        </div>
      </div>
    </div>
    <div class="brand-mark">LIREATE</div>
  </div>
</div>
</body></html>
