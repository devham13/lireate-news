name: lireate-cover-style

on:
  pull_request:
    paths:
      - "memory/blog/articles/L*/**"
      - "memory/blog/cover-style*"
      - "scripts/lireate_cover_style*.py"
      - "scripts/lireate_cover_text_overlay.py"
  push:
    branches:
      - main
    paths:
      - "memory/blog/articles/L*/article.meta.json"
      - "scripts/lireate_cover_style*.py"

jobs:
  rotation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install Pillow for sample compile
        run: pip install Pillow
      - name: Cover style rotation (all Lireate articles)
        run: python3 scripts/lireate_cover_style_check.py --all-lireate
