name: lireate-python-compat

on:
  pull_request:
    paths:
      - "scripts/lireate_*.py"
      - "scripts/lireate_*.sh"
      - "hosting/**"
      - ".github/workflows/lireate-py38.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/lireate_*.py"

jobs:
  compile-36:
    runs-on: ubuntu-latest
    container:
      image: python:3.6
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile Lireate scripts (Python 3.6)
        run: |
          python -m py_compile scripts/lireate_compat.py
          python -m py_compile scripts/lireate_dotenv.py
          python -m py_compile scripts/lireate_publish_bundle.py
          python -m py_compile scripts/lireate_publish_live.py
          python -m py_compile scripts/lireate_local_deploy.py
          python -m py_compile scripts/lireate_cms_http.py
          python -m py_compile scripts/lireate_cms_probe.py
          python -m py_compile scripts/lireate_hosting_publish.py
          python -m py_compile scripts/lireate_hosting_selfcheck.py
          python -m py_compile scripts/lireate_news_publish.py
          python -m py_compile scripts/lireate_reg_ru_check.py
          python -m py_compile scripts/lireate_db_invoke.py
          python -m py_compile scripts/lireate_hosting_db_diagnostic.py
          python -m py_compile scripts/lireate_translit.py
          python -m py_compile scripts/lireate_news_format.py
          python -m py_compile scripts/lireate_hosting_images.py
          # webmaster_export requires Python 3.7+ (future annotations); checked in compile-38
          python -m py_compile scripts/lireate_cover_text_overlay.py
          python -m py_compile scripts/lireate_topic_queue.py
          python -m py_compile scripts/lireate_cover_era_check.py
          python -m py_compile scripts/lireate_cover_era_pick.py
          python -m py_compile scripts/lireate_cover_kie.py
          python -m py_compile scripts/lireate_collage_pipeline.py
          python -m py_compile scripts/lireate_collage_publish_gate.py
          python -m py_compile scripts/lireate_cover_collage.py
          python -m py_compile scripts/lireate_privacy_link_policy.py

  php-legacy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "5.6"
      - name: PHP 5.6 syntax (hosting endpoint)
        run: php -l hosting/lireate-analytics/webmaster.php

  compile-38:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile Lireate scripts (Python 3.8)
        run: |
          python -m compileall -q scripts/lireate_*.py
      - name: PHP syntax check
        run: |
          php -l scripts/lireate_db_publish.php
          php -l hosting/lireate-analytics/webmaster.php
