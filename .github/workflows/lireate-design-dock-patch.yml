name: lireate-design-dock-patch

on:
  push:
    paths:
      - "scripts/lireate_design_patch_service_mobile_dock.py"
      - "scripts/lireate_design_dock_main_fixture.py"
      - "scripts/lireate_design_service_mobile_dock_selftest.sh"
      - "scripts/lireate_design_main_php_patch_lib.sh"
      - "scripts/lireate_design_patch_static_lu.py"
      - "scripts/lireate_design_static_lu_selftest.sh"
      - "scripts/lireate_design_legacy_cms_selftest.sh"
      - "scripts/lireate_design_patch_legacy_cms_services.py"
      - "scripts/lireate_design_main_php_sanitize.py"
      - "scripts/lireate_design_main_php_marker_guard.py"
      - ".github/workflows/lireate-design-dock-patch.yml"
  pull_request:
    paths:
      - "scripts/lireate_design_patch_service_mobile_dock.py"
      - "scripts/lireate_design_dock_main_fixture.py"
      - "scripts/lireate_design_service_mobile_dock_selftest.sh"
      - "scripts/lireate_design_main_php_patch_lib.sh"
      - "scripts/lireate_design_patch_static_lu.py"
      - "scripts/lireate_design_static_lu_selftest.sh"
      - "scripts/lireate_design_legacy_cms_selftest.sh"
      - "scripts/lireate_design_patch_legacy_cms_services.py"
      - "scripts/lireate_design_main_php_sanitize.py"
      - "scripts/lireate_design_main_php_marker_guard.py"
      - ".github/workflows/lireate-design-dock-patch.yml"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: URI legacy regex (mktu1?)
        run: python3 scripts/lireate_design_dock_uri_regex_check.py
      - name: Service dock main.php patch selftest
        run: bash scripts/lireate_design_service_mobile_dock_selftest.sh
      - name: Static LU patch selftest (no stray quote)
        run: bash scripts/lireate_design_static_lu_selftest.sh
      - name: Legacy CMS patch selftest (body + pagekey)
        run: bash scripts/lireate_design_legacy_cms_selftest.sh
