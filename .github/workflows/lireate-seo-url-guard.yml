name: lireate-seo-url-guard

on:
  pull_request:
    paths:
      - "memory/blog/articles/L*/**"
      - "scripts/lireate_seo_url_publish_guard.py"
      - "scripts/test_lireate_seo_url_publish_guard.py"
      - "memory/topics/blog-topics.md"
      - ".github/workflows/lireate-seo-url-guard.yml"
  push:
    branches:
      - main
    paths:
      - "memory/blog/articles/L*/article.meta.json"
      - "scripts/lireate_seo_url_publish_guard.py"

jobs:
  seo-url-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline)
        run: python3 scripts/test_lireate_seo_url_publish_guard.py
      - name: Unpublished seo_url must not be live (HTTP)
        env:
          LIREATE_PUBLIC_SITE_URL: ${{ secrets.LIREATE_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$LIREATE_PUBLIC_SITE_URL" ]; then
            echo "WARN: LIREATE_PUBLIC_SITE_URL secret unset; offline checks only"
            python3 scripts/lireate_seo_url_publish_guard.py --skip-live
          else
            python3 scripts/lireate_seo_url_publish_guard.py --site-base "$LIREATE_PUBLIC_SITE_URL"
          fi
